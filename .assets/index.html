<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scener Profile</title>
    <link rel="stylesheet" href="design_file.css">
</head>
<body>
    <div class="container">
        <!-- Header Navigation -->
        <header class="header">
            <div class="logo">
                <svg width="120" height="40" viewBox="0 0 120 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M378.5 23C378.5 29.9036 372.904 35.5 366 35.5C359.096 35.5 353.5 29.9036 353.5 23C353.5 16.0964 359.096 10.5 366 10.5C372.904 10.5 378.5 16.0964 378.5 23Z" fill="#FF00FF" fill-opacity="0.2" stroke="#FF00FF"/>
                    <path d="M366 18L366 28" stroke="#FF00FF" stroke-width="2" stroke-linecap="round"/>
                    <path d="M371 23L361 23" stroke="#FF00FF" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <span class="logo-text">scener</span>
            </div>
            <nav class="main-nav">
                <ul>
                    <li><a href="#">Premium</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">FAQ</a></li>
                    <li><a href="#">Be a Host</a></li>
                </ul>
            </nav>
            <div class="user-controls">
                <div class="user-icon">
                    <svg width="30" height="30" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="15" cy="15" r="14.5" fill="#3D3D3D" stroke="#FF00FF"/>
                    </svg>
                </div>
                <button class="get-scener-btn">Get Scener</button>
            </div>
        </header>

        <!-- Profile Section -->
        <section class="profile-section">
            <div class="profile-header">
                <h1 class="profile-name">Darssini</h1>
                <p class="profile-username">@darssini_lr</p>
                
                <div class="profile-controls">
                    <div class="stats-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect x="2" y="2" width="20" height="20" rx="2" stroke="white" stroke-width="2"/>
                            <path d="M7 12L10 15L17 8" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <button class="account-details-btn">Account Details</button>
                    <div class="more-options">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="12" cy="6" r="2" fill="white"/>
                            <circle cx="12" cy="12" r="2" fill="white"/>
                            <circle cx="12" cy="18" r="2" fill="white"/>
                        </svg>
                    </div>
                </div>
            </div>

            <!-- Profile Tabs -->
            <div class="profile-tabs">
                <div class="tab active">Parties</div>
                <div class="tab">Followers</div>
                <div class="tab">Following</div>
            </div>

            <!-- Profile Actions -->
            <div class="profile-actions">
                <button class="edit-schedule-btn">Edit Schedule</button>
                <button class="get-scener-btn">Get Scener</button>
            </div>
        </section>

        <!-- Parties Section -->
        <section class="parties-section">
            <div class="section-header">
                <h2>Parties I'm hosting</h2>
                <button class="schedule-party-btn">Schedule a watch party</button>
            </div>

            <!-- Party Card -->
            <div class="party-card">
                <div class="party-date">
                    <span class="date">JUN. 18</span>
                    <span class="time">3:37 PM</span>
                    <span class="lock-icon">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M4 7V5C4 2.79086 5.79086 1 8 1C10.2091 1 12 2.79086 12 5V7" stroke="white" stroke-width="2" stroke-linecap="round"/>
                            <rect x="2" y="7" width="12" height="8" rx="2" stroke="white" stroke-width="2"/>
                        </svg>
                    </span>
                </div>
                <div class="party-platform">HULU</div>
                
                <div class="party-content">
                    <div class="party-image">
                        <img src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAwIiBoZWlnaHQ9IjIwMCIgdmlld0JveD0iMCAwIDIwMCAyMDAiIGZpbGw9Im5vbmUiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PHJlY3Qgd2lkdGg9IjIwMCIgaGVpZ2h0PSIyMDAiIGZpbGw9IiMxMTBmMWQiLz48Y2lyY2xlIGN4PSI4MCIgY3k9IjEwMCIgcj0iNTAiIGZpbGw9IiNGRjAwRkYiLz48Y2lyY2xlIGN4PSI4MCIgY3k9IjEwMCIgcj0iMzAiIGZpbGw9IndoaXRlIi8+PC9zdmc+" alt="Party Image">
                    </div>
                    <div class="party-info">
                        <div class="party-host">
                            <div class="host-icon">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <circle cx="12" cy="12" r="11.5" fill="#3D3D3D" stroke="#FF00FF"/>
                                </svg>
                            </div>
                            <span class="host-name">Darssini's watch party</span>
                        </div>
                        <div class="party-options">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <circle cx="12" cy="6" r="2" fill="white"/>
                                <circle cx="12" cy="12" r="2" fill="white"/>
                                <circle cx="12" cy="18" r="2" fill="white"/>
                            </svg>
                        </div>
                    </div>
                    <button class="edit-btn">Edit</button>
                </div>
            </div>
        </section>

        <!-- Footer -->
        <footer class="footer">
            <div class="copyright">Copyright © Scener, Inc. 2025</div>
            <div class="footer-links">
                <a href="#">Help</a>
                <a href="#">Press</a>
                <a href="#">Terms</a>
                <a href="#">Privacy</a>
            </div>
        </footer>
    </div>

    <script src="design_file.js"></script>
</body>
</html>
